[package]
name = "openapk"
version = "1.0.0"
description = "OpenApk - OpenWrt 原生 apk 软件源管理与插件批量安装工具"
edition = "2021"

[lib]
name = "openapk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ssh2 = "0.9"
anyhow = "1"
